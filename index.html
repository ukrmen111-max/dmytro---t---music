<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10091b">

<title>ДМИТРО Т. — Official Music</title>

<style>
:root{
  --bg:#10091b;
  --panel:#1b1128;
  --panel2:#241633;
  --silver:#c7c7d1;
  --purple:#a987d0;
  --muted:#aaa2b8;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:#f5f0ff;
  font-family:Arial,sans-serif;
}

header{
  padding:22px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #493957;
  background:#160d22;
}

.logo{
  font-size:24px;
  font-weight:bold;
  letter-spacing:3px;
  color:var(--silver);
}

.logo span{
  color:var(--purple);
}

nav a{
  color:#ddd5e8;
  text-decoration:none;
  margin-left:22px;
  font-size:14px;
}

nav a:hover{color:var(--purple)}

.hero{
  text-align:center;
  padding:85px 20px 65px;
  background:
    radial-gradient(ellipse at center,#38234e 0%,#1b1128 45%,#10091b 100%);
}

.hero h1{
  font-size:clamp(35px,7vw,65px);
  letter-spacing:5px;
  margin:0;
  color:#eee9f5;
  text-shadow:0 0 25px #9471b8;
}

.hero p{
  color:#c3b5d3;
  letter-spacing:3px;
  margin-top:18px;
}

.hero-line{
  width:100px;
  height:2px;
  margin:30px auto 0;
  background:linear-gradient(90deg,transparent,silver,transparent);
}

main{
  max-width:1100px;
  margin:auto;
  padding:55px 20px;
}

.section-title{
  text-align:center;
  font-size:30px;
  color:var(--silver);
  letter-spacing:3px;
  margin-bottom:12px;
}

.section-subtitle{
  text-align:center;
  color:var(--muted);
  margin-bottom:40px;
}

.songs{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:25px;
}

.song{
  background:var(--panel);
  border:1px solid #51425f;
  border-radius:14px;
  padding:18px;
  transition:.25s;
}

.song:hover{
  transform:translateY(-4px);
  border-color:var(--silver);
  box-shadow:0 8px 25px #0005;
}

.cover{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  border-radius:10px;
  background:linear-gradient(135deg,#38234e,#171020);
  display:block;
}

.cover-placeholder{
  width:100%;
  aspect-ratio:1/1;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#49305f,#171020);
  color:#cbb9df;
  font-size:65px;
}

.song h3{
  font-size:21px;
  color:#eee7f5;
  margin:18px 0;
}

audio{
  width:100%;
  margin-bottom:14px;
  height:42px;
}

.download{
  display:block;
  text-align:center;
  padding:13px;
  border:1px solid silver;
  border-radius:7px;
  color:white;
  text-decoration:none;
  background:linear-gradient(135deg,#8d6bac,#56366f);
  font-weight:bold;
}

.download:hover{
  background:linear-gradient(135deg,#a987d0,#68418e);
}

#status{
  text-align:center;
  color:var(--muted);
  padding:30px 10px;
}

.about{
  margin-top:65px;
  padding:35px 20px;
  text-align:center;
  background:var(--panel);
  border:1px solid #493957;
  border-radius:14px;
}

.about h2{
  color:var(--silver);
  letter-spacing:2px;
}

.about p{
  color:var(--muted);
  line-height:1.7;
}

footer{
  border-top:1px solid #493957;
  padding:30px 15px;
  text-align:center;
  color:#93899e;
  font-size:13px;
}

footer a{
  color:#c9b8e8;
  text-decoration:none;
}

@media(max-width:600px){
  header{
    padding:18px 15px;
    flex-direction:column;
    gap:15px;
  }

  .logo{font-size:21px}

  nav a{
    margin:0 10px;
  }

  .hero{padding:65px 15px}

  main{padding:40px 15px}
}
</style>
</head>

<body>

<header>
  <div class="logo">ДМИТРО <span>Т.</span></div>

  <nav>
    <a href="#music">Музика</a>
    <a href="#about">Про мене</a>
  </nav>
</header>

<section class="hero">
  <h1>ДМИТРО Т.</h1>
  <p>OFFICIAL MUSIC</p>
  <div class="hero-line"></div>
</section>

<main>

  <section id="music">

    <h2 class="section-title">МОЯ МУЗИКА</h2>

    <p class="section-subtitle">
      Слухай. Відчувай. Завантажуй.
    </p>

    <div id="songs" class="songs"></div>

    <div id="status">Завантаження музики...</div>

  </section>

  <section class="about" id="about">
    <h2>ДМИТРО Т.</h2>
    <p>
      Офіційна музична сторінка.
      Авторські пісні, музика та творчість.
    </p>
  </section>

</main>

<footer>
  <p>© 2026 ДМИТРО Т. — Official Music</p>
  <a href="admin.html">Адміністрація</a>
</footer>

<script>
const songsBox = document.getElementById("songs");
const statusBox = document.getElementById("status");

function createSong(song){

  const card = document.createElement("article");
  card.className = "song";

  if(song.cover){

    const img = document.createElement("img");
    img.className = "cover";
    img.alt = "Обкладинка — " + song.title;
    img.src = new URL(song.cover, location.href).href;

    img.onerror = function(){
      const placeholder = document.createElement("div");
      placeholder.className = "cover-placeholder";
      placeholder.textContent = "♫";
      this.replaceWith(placeholder);
    };

    card.appendChild(img);

  }else{

    const placeholder = document.createElement("div");
    placeholder.className = "cover-placeholder";
    placeholder.textContent = "♫";
    card.appendChild(placeholder);

  }

  const title = document.createElement("h3");
  title.textContent = song.title || "Без назви";
  card.appendChild(title);

  const file = song.file || song.path;

  if(!file){
    return card;
  }

  const audio = document.createElement("audio");
  audio.controls = true;
  audio.preload = "none";
  audio.src = new URL(file, location.href).href;

  card.appendChild(audio);

  const download = document.createElement("a");
  download.className = "download";
  download.href = audio.src;
  download.download = "";
  download.textContent = "ЗАВАНТАЖИТИ MP3";

  card.appendChild(download);

  return card;
}

async function loadSongs(){

  try{

    const response = await fetch(
      "songs.json?v=" + Date.now(),
      {cache:"no-store"}
    );

    if(!response.ok){
      throw new Error("Не вдалося завантажити каталог.");
    }

    const songs = await response.json();

    if(!Array.isArray(songs)){
      throw new Error("Помилка формату каталогу.");
    }

    songsBox.replaceChildren();

    if(songs.length === 0){
      statusBox.textContent = "Поки що пісень немає.";
      return;
    }

    songs.forEach(song=>{
      songsBox.appendChild(createSong(song));
    });

    statusBox.textContent = "";

  }catch(error){

    statusBox.textContent =
      "Не вдалося завантажити музику. Спробуй оновити сторінку.";

    console.error(error);

  }
}

loadSongs();
</script>

</body>
</html>
