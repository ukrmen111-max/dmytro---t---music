<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Адміністратор — Дмитро Т.</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:25px;
  background:#10091b;
  color:#f5f0ff;
  font-family:Arial,sans-serif;
}

.container{
  max-width:500px;
  margin:40px auto;
  padding:28px;
  background:#1b1128;
  border:1px solid silver;
  border-radius:14px;
}

h1{
  color:#d8c9f0;
  text-align:center;
}

p{
  color:#aaa2b8;
  text-align:center;
}

label{
  display:block;
  margin-top:20px;
  color:#c9b8e8;
}

input{
  width:100%;
  padding:13px;
  margin-top:8px;
  background:#222;
  color:white;
  border:1px solid #755b91;
  border-radius:6px;
}

button{
  width:100%;
  margin-top:25px;
  padding:15px;
  border:1px solid silver;
  border-radius:6px;
  background:linear-gradient(135deg,#a987d0,#68418e);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{opacity:.5}

#status{
  margin-top:20px;
  text-align:center;
  overflow-wrap:anywhere;
}

#preview{
  display:none;
  width:180px;
  height:180px;
  object-fit:cover;
  margin:18px auto 0;
  border:2px solid silver;
  border-radius:12px;
}

.note{
  font-size:12px;
  text-align:left;
}
</style>
</head>

<body>

<div class="container">

<h1>ДМИТРО Т.</h1>
<p>Панель адміністратора</p>

<form id="uploadForm">

<label>Пароль адміністратора</label>
<input type="password" id="password" required>

<label>Назва пісні</label>
<input type="text" id="title" required>

<label>Вибрати MP3</label>
<input type="file" id="audio"
accept=".mp3,audio/mpeg" required>
<p class="note">Максимальний розмір MP3 — 4 МБ.</p>

<label>Обкладинка пісні</label>
<input type="file" id="cover"
accept="image/jpeg,image/png,image/webp" required>

<p class="note">JPG, PNG або WEBP. Максимум 5 МБ.</p>

<img id="preview" alt="Попередній перегляд обкладинки">

<button type="submit" id="submitBtn">
ОПУБЛІКУВАТИ ПІСНЮ
</button>

</form>

<div id="status"></div>

</div>

<script>
const form = document.getElementById("uploadForm");
const statusBox = document.getElementById("status");
const button = document.getElementById("submitBtn");
const coverInput = document.getElementById("cover");
const preview = document.getElementById("preview");

coverInput.addEventListener("change", function(){

  const file = this.files[0];

  if(!file){
    preview.style.display = "none";
    return;
  }

  const allowed = [
    "image/jpeg",
    "image/png",
    "image/webp"
  ];

  if(!allowed.includes(file.type) ||
     file.size > 5 * 1024 * 1024){

    statusBox.textContent =
      "Вибери JPG, PNG або WEBP до 5 МБ.";

    this.value = "";
    preview.style.display = "none";
    return;
  }

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
  statusBox.textContent = "";
});

function readBase64(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();

    reader.onload = () =>
      resolve(reader.result.split(",")[1]);

    reader.onerror = reject;

    reader.readAsDataURL(file);
  });
}

form.addEventListener("submit", async function(e){

  e.preventDefault();

  const password =
    document.getElementById("password").value;

  const title =
    document.getElementById("title").value.trim();

  const audio =
    document.getElementById("audio").files[0];

  const cover = coverInput.files[0];

  if(!password || !title || !audio || !cover){
    statusBox.textContent =
      "Заповни всі поля та вибери обидва файли.";
    return;
  }

  if(!audio.name.toLowerCase().endsWith(".mp3") ||
     audio.size > 4 * 1024 * 1024){

    statusBox.textContent =
      "MP3 повинен бути не більшим за 4 МБ.";
    return;
  }

  if(
    !["image/jpeg","image/png","image/webp"].includes(cover.type) ||
    cover.size > 5 * 1024 * 1024
  ){
    statusBox.textContent =
      "Обкладинка повинна бути JPG, PNG або WEBP до 5 МБ.";
    return;
  }

  button.disabled = true;
  statusBox.textContent = "Завантаження пісні та обкладинки...";

  try{

    const fileBase64 = await readBase64(audio);
    const coverBase64 = await readBase64(cover);

    const response = await fetch(
      "/.netlify/functions/upload-song",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          password,
          title,
          fileBase64,
          coverBase64,
          coverType:cover.type
        })
      }
    );

    const result = await response.json();

    if(!response.ok){
      throw new Error(
        result.error || "Помилка завантаження."
      );
    }

    statusBox.textContent =
      "Пісню та обкладинку успішно завантажено!";

    form.reset();
    preview.style.display = "none";
    preview.removeAttribute("src");

  }catch(error){

    statusBox.textContent = error.message;

  }finally{

    button.disabled = false;

  }

});
</script>

</body>
</html>
